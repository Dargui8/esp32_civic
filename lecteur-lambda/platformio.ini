; Compilation avec PlatformIO, depuis ce dossier :
;   pio run -e esp32 -t upload      (ou -e mega, -e pico)
;   pio device monitor              (journal CSV et commandes, 115200 bauds)
;
; Les choix principaux de config.h peuvent être imposés ici, par exemple
; un OLED et un MCP4725 :
;   build_flags = -D CFG_ECRAN=2 -D CFG_SORTIE=2

[platformio]
src_dir = LecteurLambda
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit BusIO@^1.14.0

[env:esp32]
platform = espressif32
board = esp32dev

[env:mega]
platform = atmelavr
board = megaatmega2560

[env:pico]
; Core « Raspberry Pi Pico/RP2040 » d'Earle Philhower (seul pris en charge).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
